# EKS only: encrypted gp3 EBS volumes via the EBS CSI driver (installed by Terraform).
# Newer EKS clusters have no default StorageClass, so PVCs would otherwise stay Pending.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer   # create the volume in the AZ where the pod lands
allowVolumeExpansion: true
reclaimPolicy: Delete
