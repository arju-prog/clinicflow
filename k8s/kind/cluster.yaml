# Local 3-node Kubernetes cluster for rehearsing the EKS deployment:
#   kind create cluster --config k8s/kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clinicflow
nodes:
  - role: control-plane
    # Traefik's NodePort 30080 -> http://clinicflow.localhost on the laptop (port 80).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker
