apiVersion: v1
kind: Namespace
metadata:
  name: clinicflow
  labels:
    app.kubernetes.io/part-of: clinicflow
    # Pod Security Admission: reject privileged pods outright, and warn about anything
    # that falls short of the "restricted" profile (the ClinicFlow chart meets it).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
