{{- if .Values.postgres.enabled }}
{{- $fullname := include "clinicflow.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicflow.labels" . | nindent 8 }}
        {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the Alpine image
        runAsGroup: 70
        fsGroup: 70          # make the volume writable by that user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ $fullname }}-postgres, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ $fullname }}-postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $fullname }}-postgres, key: password } }
            # A subdirectory avoids the "lost+found" folder at the root of fresh EBS volumes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            {{- include "clinicflow.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Postgres only writes to its data volume, its socket dir and /tmp, so the
            # image filesystem itself can stay read-only.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
