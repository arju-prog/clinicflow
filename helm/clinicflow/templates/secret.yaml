{{- /*
  Password resolution order:
    1. postgres.password from values (explicit)
    2. the password already stored in this Secret (so upgrades never change it)
    3. a new random password (first install only)
*/ -}}
{{- $name := printf "%s-postgres" (include "clinicflow.fullname" .) -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so a re-install still matches the data on the PVC.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
