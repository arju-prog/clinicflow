{{- if and .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clinicflow.fullname" . }}-alerts
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: clinicflow.rules
      rules:
        - alert: ClinicFlowBackendDown
          expr: sum(up{namespace="{{ .Release.Namespace }}", service="{{ include "clinicflow.fullname" . }}-backend"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No ClinicFlow backend pod is being scraped successfully
        - alert: ClinicFlowHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of ClinicFlow API requests are failing
        - alert: ClinicFlowSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: ClinicFlow API p95 latency is above 1 second
{{- end }}
