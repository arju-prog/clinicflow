{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
# Only backend pods may open connections to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clinicflow.fullname" . }}-postgres
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clinicflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "clinicflow.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
