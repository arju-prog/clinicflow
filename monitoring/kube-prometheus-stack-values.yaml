# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

# Alerts are still evaluated and visible on Prometheus' /alerts page; Alertmanager
# (routing to Slack/email) is left out to keep the classroom cluster small.
alertmanager:
  enabled: false

# Managed control planes (EKS) and kind don't expose these components to Prometheus;
# disabling them avoids permanently-DOWN targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace, not only ones
    # labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    retention: 3d
    scrapeInterval: 15s
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

grafana:
  enabled: true
  # Admin password is generated and stored in the "kube-prometheus-stack-grafana" Secret:
  #   kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL          # find the ClinicFlow dashboard ConfigMap in the app namespace
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }   # recent Grafana releases are OOM-killed at 256Mi

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
