# ClinicFlow CI/CD
#
#   test-backend ──┐
#   test-frontend ─┤
#   lint-iac ──────┼─► build-scan-push (backend, frontend) ─► deploy (EKS via Helm)
#   secret-scan ───┘
#
# - Every push / PR runs the tests and the Trivy scan.
# - Only pushes to main publish images to GHCR and deploy.
# - Images are tagged with the full Git commit SHA (never `latest`), so any running
#   pod can be traced back to the exact commit that built it.
name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/clinicflow
  HELM_RELEASE: clinicflow
  K8S_NAMESPACE: clinicflow

jobs:
  # ───────────────────────────── Stage 1: TEST ─────────────────────────────
  test-backend:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Quality gate #1: a failing test exits non-zero, which fails this job and
      # (via `needs:`) stops every image build, push and deploy below.
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  test-frontend:
    name: Frontend · test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build production bundle
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  lint-iac:
    name: IaC · helm lint + terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4

      - name: Helm lint + render
        run: |
          helm lint helm/clinicflow
          helm lint helm/clinicflow -f helm/clinicflow/values-prod.yaml
          helm template clinicflow helm/clinicflow -f helm/clinicflow/values-prod.yaml > /dev/null

      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  secret-scan:
    name: Repo · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails the pipeline if credentials (AWS keys, tokens, private keys...) are committed.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      # Report-only IaC review of Terraform / Helm / Dockerfiles.
      - name: Trivy misconfiguration report (Terraform, Helm, Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          skip-setup-trivy: true

  # ─────────────────── Stage 2: BUILD + SECURITY SCAN + PUSH ───────────────────
  build-scan-push:
    name: Image · ${{ matrix.component }}
    needs: [test-backend, test-frontend, lint-iac, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR with the built-in GITHUB_TOKEN
      security-events: write   # upload Trivy SARIF to the repo's Security tab
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name (GHCR requires lowercase)
        id: image
        run: echo "name=${IMAGE_PREFIX,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Pinned to a commit SHA: trivy-action's version tags were hijacked in a
      # March 2026 supply-chain attack, so tags alone are not trustworthy.
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      # Quality gate #2: any fixable HIGH/CRITICAL vulnerability fails the job,
      # so a vulnerable image is never pushed.
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      # Push the exact image that was scanned (no rebuild), so what reaches the
      # registry is byte-for-byte what Trivy approved.
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Pushed \`${{ steps.image.outputs.name }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── Stage 3: DEPLOY ─────────────────────────────
  # Runs only when the EKS cluster exists. Set these repository *variables*
  # (Settings → Secrets and variables → Actions → Variables) after `terraform apply`:
  #   AWS_DEPLOY_ROLE_ARN  = terraform output github_actions_role_arn
  #   AWS_REGION           = ap-south-1
  #   EKS_CLUSTER_NAME     = terraform output cluster_name
  #   INGRESS_HOST         = (optional) hostname for the Ingress rule
  # Authentication is keyless (GitHub OIDC → IAM role); no AWS keys are stored in GitHub.
  deploy:
    name: Deploy · Helm → EKS
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write   # required for OIDC federation to AWS
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - uses: azure/setup-helm@v5

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME || 'clinicflow-eks' }}" --region "${{ vars.AWS_REGION || 'ap-south-1' }}"

      - name: Helm upgrade --install
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          helm upgrade --install "$HELM_RELEASE" ./helm/clinicflow \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            -f helm/clinicflow/values-prod.yaml \
            --set backend.image.repository="${image_prefix}-backend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${image_prefix}-frontend" \
            --set frontend.image.tag="${{ github.sha }}" \
            ${{ vars.INGRESS_HOST && format('--set ingress.host={0}', vars.INGRESS_HOST) || '' }} \
            --wait --timeout 10m --rollback-on-failure

      - name: Verify rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/clinicflow-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/clinicflow-frontend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" get pods,svc,ingress,hpa -o wide
          helm history "$HELM_RELEASE" -n "$K8S_NAMESPACE" --max 5

      - name: Summary
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to EKS"
            echo '```'
            kubectl -n "$K8S_NAMESPACE" get pods -o custom-columns=POD:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
